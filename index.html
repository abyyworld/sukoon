<!doctype html>
<html lang="en" data-theme="pearl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukoon — Finance, with clarity.</title>
<meta name="description" content="Sukoon maps Islamic finance in Uzbekistan: your goal in, real options out, with sources and verification dates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Source+Sans+3:wght@400;500;600;700&display=swap&subset=latin-ext,cyrillic" rel="stylesheet">
<style>
/* ============ THEMES ============
   Pearl: Country Air bg, White Swan panels, Faded Denim primary, Pearl Blue secondary, Jadeite accent, Shadow text family.
   Olive: warm ivory, white cards, deep (lightened) olive, champagne gold, olive-charcoal text.
   The site is always light: the brief asks for a bright, airy look. */
:root,:root[data-theme="pearl"]{
  --bg:#CBD9E6;--bg-top:#DCE6EF;--panel:#E4D7C6;--card:#F5F0E9;--card-2:#FBF8F3;--chip:#EEF2F6;
  --primary:#798DA5;--primary-ink:#4E6280;--primary-soft:#DCE3EC;--on-primary:#FFFFFF;
  --accent:#B0B7BF;--accent-ink:#5D6772;--jade:#95A69E;--jade-ink:#4F6458;
  --text:#363B33;--muted:#5A6056;--faint:#878D83;--line:#B7C4D1;--line-soft:#D3DCE5;
  --ok:#4F6458;--ok-bg:#DFE8E2;--warn:#7A5A1E;--warn-bg:#F1E6CF;--grey:#5E6772;--grey-bg:#E3E8EE;--no:#8A3F42;--no-bg:#F1E0DF;
  --orb-hi:#FFFFFF;--orb-1:#F1F4F8;--orb-2:#D6DDE6;--orb-3:#A9B4C1;--orb-tint:rgba(214,196,226,.35);
  --moon-1:#FFFFFF;--moon-2:#DDE3EA;--moon-3:#97A3B1;--ring:#AEB8C4;
  --shadow:0 1px 2px rgba(56,72,92,.06),0 10px 30px rgba(56,72,92,.10);--glass:rgba(255,255,255,.42);
}
:root[data-theme="olive"]{
  --bg:#F6F2E6;--bg-top:#FBF8EF;--panel:#FBF8EF;--card:#FFFFFF;--card-2:#FFFDF8;--chip:#F3EFE2;
  --primary:#6B7F4A;--primary-ink:#4E6034;--primary-soft:#E7ECDA;--on-primary:#FFFFFF;
  --accent:#C2A66B;--accent-ink:#7E6230;--jade:#8FA06F;--jade-ink:#4E6034;
  --text:#2F3529;--muted:#5E6656;--faint:#8A9180;--line:#E2DBC6;--line-soft:#ECE6D6;
  --ok:#4E6034;--ok-bg:#E7ECDA;--warn:#7A5A1E;--warn-bg:#F5EAD3;--grey:#646A5E;--grey-bg:#EFEDE6;--no:#8A3F3A;--no-bg:#F5E4E1;
  --orb-hi:#FFFDF6;--orb-1:#FBF5E6;--orb-2:#EAD9B2;--orb-3:#C2A66B;--orb-tint:rgba(194,166,107,.18);
  --moon-1:#FFF8E6;--moon-2:#E6CF97;--moon-3:#A8874A;--ring:#C2A66B;
  --shadow:0 1px 2px rgba(70,62,30,.05),0 10px 30px rgba(70,62,30,.08);--glass:rgba(255,255,255,.38);
}
:root{--serif:"Literata",Georgia,"Times New Roman",serif;--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:20px;--r-sm:12px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg-top),var(--bg) 520px) var(--bg);color:var(--text);font-family:var(--sans);font-size:16.5px;line-height:1.55;font-variant-numeric:tabular-nums;overflow-x:hidden;min-height:100vh;transition:background-color .4s}
a{color:var(--primary-ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary-ink);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.2;margin:0;color:var(--text)}
h1{font-size:clamp(30px,4.6vw,48px)} h2{font-size:clamp(23px,3vw,31px)} h3{font-size:20px} h4{font-size:17px;font-weight:600}
p{margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:14.5px} .tiny{font-size:13px}
.eyebrow{font-size:12.5px;letter-spacing:.16em;font-weight:700;color:var(--accent-ink);text-transform:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ HEADER ============ */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg-top) 80%,transparent);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.top .wrap{display:flex;align-items:center;gap:14px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.14em;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.cta-top{background:var(--primary-ink);color:var(--on-primary);text-decoration:none;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14.5px;white-space:nowrap}
.cta-top:hover{filter:brightness(1.08)}
nav.main{display:flex;align-items:center;gap:2px;margin-left:6px}
nav.main a{padding:7px 11px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;border-radius:999px;white-space:nowrap}
nav.main a[aria-current="page"]{color:var(--text);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line-soft)}
nav.main .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg-mini{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card-2)}
.seg-mini button{border:0;background:transparent;padding:5px 9px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg-mini button[aria-pressed="true"]{background:var(--primary-ink);color:var(--on-primary)}
.theme-dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.icon-btn{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text)}
.menu-btn{display:none}
@media (max-width:1060px){nav.main{display:none}.menu-btn{display:inline-flex}}
@media (max-width:560px){.top .wrap{gap:8px;height:60px}.brand{font-size:18px;letter-spacing:.1em}.brand svg{width:26px;height:26px}.cta-top{padding:7px 12px;font-size:13.5px}.tools .seg-mini.lang,.tools .theme-sw,.tools .about-btn{display:none}}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(30,36,44,.28);backdrop-filter:blur(3px)}
.sheet .in{position:absolute;right:0;top:0;bottom:0;width:min(340px,88vw);background:var(--bg-top);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 24px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.sheet a.nl{display:block;padding:12px 4px;border-bottom:1px solid var(--line-soft);color:var(--text);text-decoration:none;font-weight:600;font-size:17px}
.sheet .grp{font-size:12px;letter-spacing:.14em;color:var(--faint);font-weight:700;margin:18px 0 4px}

/* ============ GENERIC ============ */
main{min-height:70vh;position:relative}
.page{padding-top:30px;padding-bottom:72px;position:relative}
.lead{font-size:18px;color:var(--muted);max-width:64ch;margin:10px 0 0}
.section{margin-top:30px}
.panel{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.panel.swan{background:var(--panel)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15.5px;transition:transform .15s,filter .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary-ink);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.line{border-color:var(--line);background:var(--card-2);color:var(--text)}
.btn.line:hover{border-color:var(--primary)}
.btn.line[aria-pressed="true"]{border-color:var(--primary-ink);background:var(--primary-soft)}
.btn.sm{padding:6px 13px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary-ink);padding:6px 4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:7px 14px;font-size:14.5px;cursor:pointer;font-weight:600;color:var(--text);transition:all .18s}
.chip:hover{border-color:var(--primary)}
.chip[aria-pressed="true"]{background:var(--primary-ink);border-color:var(--primary-ink);color:var(--on-primary)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--line-soft);white-space:nowrap}
input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card-2)}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--primary-ink);height:28px;margin:6px 0 0}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.npd{color:var(--grey);font-style:italic}
.nv{color:var(--warn);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.kv{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:8px 16px;font-size:15px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:540px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.tablewrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-top:1px solid var(--line-soft)}
thead th{border-top:0;font-size:13px;color:var(--muted);font-weight:700;background:var(--chip)}
tbody th{font-weight:600;min-width:140px}
.ticks{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px;font-size:15px}
.ticks li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start}
.ticks .i{font-weight:800;text-align:center}
.i-ok{color:var(--ok)} .i-no{color:var(--no)} .i-q{color:var(--grey)} .i-w{color:var(--warn)}
details.x{border-top:1px solid var(--line-soft);margin-top:16px}
details.x>summary{cursor:pointer;padding:13px 0 8px;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.x>summary::-webkit-details-marker{display:none}
details.x>summary::after{content:"+";font-size:20px;color:var(--primary-ink);font-weight:500}
details.x[open]>summary::after{content:"–"}
.fade-in{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade-in{animation:none}*{scroll-behavior:auto!important}}

/* verification dots: icon + text, never colour alone */
.vstat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.vstat i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 12%,transparent)}
.v-verified{color:var(--ok)} .v-verified i{background:#3E9C6B}
.v-partial{color:var(--warn)} .v-partial i{background:#D9A93B}
.v-limited{color:var(--grey)} .v-limited i{background:#fff;border:1.5px solid #9AA3AE}
.out-b{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.o-ok{background:var(--ok-bg);color:var(--ok)} .o-c{background:var(--warn-bg);color:var(--warn)} .o-u{background:var(--grey-bg);color:var(--grey)} .o-no{background:var(--no-bg);color:var(--no)}

/* ============ 3D OBJECTS ============ */
.scene{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.obj{position:absolute;will-change:transform}
.pearl{border-radius:50%;background:
  radial-gradient(circle at 30% 26%,var(--orb-hi) 0,rgba(255,255,255,.9) 8%,transparent 26%),
  radial-gradient(circle at 70% 78%,var(--orb-tint),transparent 45%),
  radial-gradient(circle at 42% 40%,var(--orb-1) 0,var(--orb-2) 48%,var(--orb-3) 100%);
  box-shadow:inset -10px -14px 26px rgba(70,84,104,.18),inset 8px 10px 18px rgba(255,255,255,.75),0 26px 40px -22px rgba(60,76,96,.45)}
:root[data-theme="olive"] .pearl.gold{background:radial-gradient(circle at 30% 26%,#FFFBEF 0,rgba(255,250,235,.9) 9%,transparent 28%),radial-gradient(circle at 42% 40%,#F6E6BE 0,#DCC184 50%,#A8874A 100%);box-shadow:inset -8px -12px 22px rgba(120,90,30,.25),inset 6px 8px 14px rgba(255,255,255,.6),0 20px 32px -18px rgba(120,90,30,.45)}
.glass{border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75),rgba(255,255,255,.12) 38%,rgba(255,255,255,.05) 60%,color-mix(in srgb,var(--primary) 18%,transparent));border:1px solid rgba(255,255,255,.65);box-shadow:inset -18px -24px 50px color-mix(in srgb,var(--primary) 16%,transparent),inset 10px 14px 30px rgba(255,255,255,.55),0 40px 70px -40px rgba(40,50,60,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ringo{border-radius:50%;border:1.6px solid var(--ring);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 18px color-mix(in srgb,var(--ring) 30%,transparent)}
.float{animation:float 10s ease-in-out infinite}
.float.d2{animation-duration:12.5s;animation-delay:-3s}.float.d3{animation-duration:15s;animation-delay:-7s}
@keyframes float{50%{translate:0 -14px}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.decor{position:absolute;right:0;top:0;width:min(420px,48%);height:100%;pointer-events:none;z-index:0;overflow:hidden}
@media (max-width:700px){.decor{width:55%;opacity:.55}.scene .m-hide{display:none}}

/* ============ HOME ============ */
.hero{position:relative;padding:64px 0 40px;isolation:isolate;min-height:min(700px,92vh)}
.hero .copy{position:relative;z-index:2;max-width:640px}
.wordmark{font-family:var(--serif);font-weight:500;letter-spacing:.16em;font-size:clamp(58px,12vw,136px);line-height:1;margin:0;color:var(--text)}
.slogan{font-family:var(--serif);font-size:clamp(20px,2.6vw,27px);font-style:italic;color:var(--primary-ink);margin:14px 0 0}
.sub-slogan{font-size:16px;color:var(--muted);margin:6px 0 0;letter-spacing:.02em}
.ask{font-family:var(--serif);font-size:clamp(21px,2.4vw,26px);margin:40px 0 14px;position:relative;z-index:2}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative;z-index:2}
@media (max-width:860px){.goals{grid-template-columns:1fr}}
.goal{display:block;padding:24px 22px 22px;border-radius:var(--r);text-decoration:none;color:var(--text);background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow);transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;overflow:hidden}
.goal:hover{transform:translateY(-4px);border-color:var(--primary)}
.goal .k{font-size:13px;letter-spacing:.2em;font-weight:800;color:var(--primary-ink)}
.goal h3{font-size:21px;margin:8px 0 6px}
.goal p{margin:0;color:var(--muted);font-size:15px}
.goal .go{margin-top:14px;font-weight:700;font-size:14.5px;color:var(--primary-ink)}
.under{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;position:relative;z-index:2}
.promise{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:40px 0 70px}
@media (max-width:860px){.promise{grid-template-columns:1fr}}
.promise .big{font-family:var(--serif);font-size:clamp(24px,3vw,32px);line-height:1.3}
.legend{display:grid;gap:10px}
.legend div{display:flex;gap:10px;align-items:center;font-size:15px}

/* ============ PATHWAY ============ */
.flow{display:grid;grid-template-columns:minmax(310px,400px) 1fr;gap:28px;align-items:start;margin-top:22px;position:relative;z-index:1}
@media (max-width:960px){.flow{grid-template-columns:1fr}}
.builder{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 104px);overflow:auto;background:var(--panel)}
@media (max-width:960px){.builder{position:static;max-height:none}}
.step{padding:14px 0 16px;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.step:first-of-type{border-top:0;padding-top:4px}
.step .h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.step .n{font-family:var(--serif);font-size:15px;color:var(--accent-ink);font-weight:600;min-width:22px}
.step .q{font-weight:700;font-size:16px}
.step .val{margin-left:auto;font-weight:800;color:var(--primary-ink);font-size:15.5px;text-align:right}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.ai-box{border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;background:color-mix(in srgb,var(--card) 60%,transparent)}
.ai-box .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.answer{border-radius:var(--r);padding:22px 24px;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--primary-soft) 60%,var(--card)));border:1px solid var(--line-soft);box-shadow:var(--shadow);position:relative;overflow:hidden}
.answer h2{margin:6px 0 6px;max-width:30ch}
.crit{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.legs{margin-top:16px;display:grid;gap:10px}
.leg{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card-2);border:1px solid var(--line-soft);align-items:start}
.leg .pct{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--primary-ink);line-height:1.1}
.leg .pct small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--faint);font-weight:700;letter-spacing:.08em}
.leg h4{font-size:17.5px}
.leg .desc{font-size:14px;color:var(--muted);margin-top:2px}
.leg .bar{height:7px;border-radius:5px;background:var(--line-soft);overflow:hidden;margin:9px 0 7px}
.leg .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-ink),var(--primary));border-radius:5px;transition:width .55s cubic-bezier(.2,.7,.2,1)}
.leg .prods{font-size:14.5px}
.leg.reserve{background:transparent;border-style:dashed}
.arrowpath{font-family:var(--serif);font-size:19px;margin:6px 0 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px;position:relative}
.pcard.unknown{border-style:dashed;box-shadow:none;background:color-mix(in srgb,var(--card) 70%,transparent)}
.pcard .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .prov{font-size:12.5px;letter-spacing:.12em;font-weight:800;color:var(--accent-ink)}
.pcard .inst{font-family:var(--serif);font-size:22px;line-height:1.15}
.pcard .what{font-size:14.5px;color:var(--muted)}
.pcard .facts{font-size:14.5px;font-weight:600}
.pcard .best{font-size:13.5px;color:var(--muted)}
.pcard .fit{font-size:13.5px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--chip)}
.pcard .fit.good{background:var(--ok-bg);color:var(--ok)} .pcard .fit.mid{background:var(--warn-bg);color:var(--warn)} .pcard .fit.bad{background:var(--no-bg);color:var(--no)}
.pcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft)}
.pcard .acts button,.pcard .acts a{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text);text-decoration:none}
.pcard .acts button[aria-expanded="true"]{background:var(--primary-soft);border-color:var(--primary-ink)}
.pcard .pane{font-size:14.5px;border-top:1px dashed var(--line);padding-top:10px}
.star{border:0;background:transparent;cursor:pointer;font-size:13px;font-weight:800;color:var(--primary-ink);padding:2px 0}
.star[aria-pressed="true"]{color:var(--accent-ink)}
.close-opt{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-radius:16px;background:var(--card-2);border:1px solid var(--line-soft);margin-top:10px}
.close-opt .lab{font-family:var(--serif);font-size:20px;color:var(--accent-ink);min-width:28px}
.why-not{padding:12px 0;border-top:1px solid var(--line-soft)}
.why-not b{display:block}
.critbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-radius:999px;background:color-mix(in srgb,var(--card) 80%,transparent);border:1px solid var(--line-soft);font-size:14px;margin-top:14px}
.critbar b{font-weight:800}

/* ============ MARKET ============ */
.mhead{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.strip{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:16px;font-size:14.5px;color:var(--muted)}
.strip b{display:block;font-family:var(--serif);font-size:24px;color:var(--text);font-weight:600}
.viz{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
@media (max-width:960px){.viz{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 30px;gap:10px;align-items:center;font-size:14px;margin:5px 0;cursor:pointer;border-radius:8px;padding:2px 4px;border:0;background:transparent;width:100%;text-align:left}
.hbar:hover{background:var(--chip)}
.hbar[aria-pressed="true"]{background:var(--primary-soft)}
.hbar .t{height:12px;border-radius:7px;background:var(--line-soft);overflow:hidden}
.hbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-ink),var(--primary));border-radius:7px;transition:width .5s}
.hbar .t i.g{background:linear-gradient(90deg,var(--accent-ink),var(--accent))}
.hbar b{text-align:right}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters label{font-size:13px;font-weight:700;color:var(--muted);display:grid;gap:4px}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);padding-left:20px}
.timeline li{margin:0 0 16px;position:relative}
.timeline li::before{content:"";position:absolute;left:-27px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--primary)}
.timeline .d{font-weight:800;font-size:13.5px;color:var(--accent-ink)}

/* ============ LEARN / COMPARE ============ */
.instr{display:flex;flex-wrap:wrap;gap:8px}
.lcard{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
@media (max-width:860px){.lcard{grid-template-columns:1fr}}
.bears{display:grid;gap:8px}
.bears div{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-soft);font-size:15px}
.bears div b{color:var(--muted);font-weight:700}
.cmp td,.cmp th{min-width:150px}
.cmp td{cursor:pointer;transition:background .2s}
.cmp td:hover{background:var(--chip)}
.cmp tr.hl td,.cmp tr.hl th{background:var(--primary-soft)}
.cmp td.sel{outline:2px solid var(--primary-ink);outline-offset:-2px}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:14px;height:8px;border-radius:3px;background:var(--line-soft)}
.meter i.on{background:var(--primary-ink)}
.cellnote{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--card-2);border:1px solid var(--line-soft);font-size:15px}
.prose{max-width:70ch}
.prose p,.prose li{font-size:16.5px;line-height:1.7}

/* ============ FOOTER / MODAL ============ */
footer{border-top:1px solid var(--line-soft);padding:26px 0 40px;color:var(--muted);font-size:14px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
footer .row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
footer a{color:var(--muted)}
.testing{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--warn);background:var(--warn-bg);padding:3px 10px;border-radius:999px}
dialog{border:0;border-radius:24px;padding:0;max-width:min(520px,92vw);background:var(--bg-top);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(30,36,44,.35);backdrop-filter:blur(3px)}
dialog .in{padding:26px}
.contact{display:grid;gap:8px;margin:14px 0}
.contact a{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line-soft);text-decoration:none;color:var(--text);font-weight:700}
</style>
</head>

  /* ---------- trade-offs ---------- */

  /* ---------- pricing, as published ---------- */

  /* ---------- INVEST scoring ---------- */

    if (typeof tmax === "number" && lo) comp.term = lo <= tmax ? 1 : 0.5;

    }

  /* ---------- run a flow ---------- */
  function run(u) {

    const evs = pool.map(p => evaluate(p, u));

  /* ---------- pathways (INVEST) ---------- */

  /* ---------- instrument pathway (no provider attached) ---------- */

  }
  function round5(parts, total) {

  function instrumentPathway(u, result, diversify) {

    const blob = JSON.stringify(F).replace(/(\d),(?=\d{3})/g, "$1");
    const nums = (out.answer.replace(/(\d),(?=\d{3})/g, "$1").match(/\d+(\.\d+)?/g) || []);

    (out.facts_used || []).forEach(id => { if (!ids.has(id)) errs.push("unknown fact id " + id); });

    ["expansion", /(kengaytir|expand|расшир|grow my business)/], ["agriculture_inputs", /(qishloq|agri|ферм|сельск|dehqon|fermer|hosil|harvest)/], ["consumer_goods", /(telefon|phone|appliance|maishiy|техник|laptop|noutbuk|mebel|furniture)/]];

  if (/(high risk|yuqori tavakkal|высок\w* риск|aggressive|агрессив)/.test(s)) out.risk = 4;
  if (/(any ?time|istalgan vaqt|в любой момент|tez yechib|quick access|liquid)/.test(s)) out.liqv = 1;

  const $ = id => document.getElementById(id);
  $("cPick").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; const s = b.dataset.c; CSEL = CSEL.includes(s) ? CSEL.filter(x => x !== s) : (CSEL.length >= 4 ? CSEL.slice(1) : CSEL).concat(s); if (!CSEL.length) CSEL = [s]; document.querySelectorAll("#cPick .chip").forEach(x => x.setAttribute("aria-pressed", CSEL.includes(x.dataset.c))); CCELL = null; renderCompare(); };
  $("cMat").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; CMAT = CMAT === b.dataset.m ? "" : b.dataset.m; document.querySelectorAll("#cMat .chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.m === CMAT)); renderCompare(); };
  $("cTable").onclick = e => { const c = e.target.closest("[data-cell]"); if (!c) return; CCELL = CCELL === c.dataset.cell ? null : c.dataset.cell; renderCompare(); };
  $("cTable").onkeydown = e => { if (e.key === "Enter") { const c = e.target.closest("[data-cell]"); if (c) { CCELL = c.dataset.cell; renderCompare(); } } };
  document.querySelectorAll("[data-cp]").forEach(s => s.onchange = () => { const ids = [...document.querySelectorAll("[data-cp]")].map(x => x.value).filter(Boolean); location.hash = "#/compare?ids=" + ids.join(","); });
  renderCompare();
}

/* ================= METHOD & SOURCES ================= */
function methodPage() {
  const rows = (PAGES[LANG] || PAGES.en).method;
  return `<div class="wrap page">${decor()}<div style="position:relative;z-index:1"><h1>${t("nav_method")}</h1><p class="lead">${t("promise")}</p></div>
  <div class="panel section legend" style="display:flex;flex-wrap:wrap;gap:18px">${["verified", "partial", "limited"].map(s => `<span class="vstat v-${s}"><i></i>${t("v_" + s)}</span>`).join("")}</div>
  <div class="grid-2 section">${rows.map(([h, p]) => `<div class="panel"><h3>${esc(h)}</h3><p class="small" style="margin-top:8px">${esc(p)}</p></div>`).join("")}</div>
  <p class="section"><a class="btn line" href="#/sources">${t("s_title")} (${DB.sources.length})</a> <button class="btn line" data-about>${t("report_corr")}</button></p></div>`;
}
function sourcesPage() {
  return `<div class="wrap page"><h1>${t("s_title")}</h1><p class="lead">${t("s_lead", { n: DB.sources.length })}</p><div class="tablewrap section"><table><thead><tr><th>ID</th><th>${t("source")}</th><th>${t("s_tier")}</th><th>${t("s_accessed")}</th></tr></thead><tbody>
  ${DB.sources.map(s => `<tr><td class="tiny">${esc(s.id)}</td><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><div class="tiny muted">${esc(s.publisher)}${s.note ? " · " + esc(s.note) : ""}</div></td><td class="small">${t("tier_" + s.tier)}</td><td class="small">${fmtDate(s.accessed)}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function notFound() { return `<div class="wrap page"><h1>${t("notfound")}</h1><p><a href="#/">${t("go_home")}</a></p></div>`; }

/* ================= ROUTER ================= */
function setNav(key) { document.querySelectorAll("nav.main a").forEach(a => a.getAttribute("data-nav") === key ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")); }
const LEGACY = [[/^\/market\/products\/(.+)$/, "/product/$1"], [/^\/market\/providers\/(.+)$/, "/providers/$1"], [/^\/intelligence$/, "/market"], [/^\/data\/sources$/, "/sources"], [/^\/data(\/.*)?$/, "/method"], [/^\/learn\/structures\/(.+)$/, "/learn/$1"], [/^\/learn\/why-terms-differ$/, "/compare"], [/^\/(invest|finance)$/, "/pathway?goal=$1"]];
function route(keep) {
  { const raw = location.hash.replace(/^#/, ""); for (const [rx, to] of LEGACY) if (rx.test(raw)) { history.replaceState(null, "", "#" + raw.replace(rx, to)); break; } }
  const h = location.hash.replace(/^#/, "") || "/"; const [path, qs] = h.split("?"); const parts = path.split("/").filter(Boolean); const q = new URLSearchParams(qs || "");
  const app = document.getElementById("app"); let html, after = null, key = "#/" + (parts[0] || "");
  const fresh = app.cloneNode(false); app.replaceWith(fresh);
  if (!parts.length) { html = homePage(); }
  else if (parts[0] === "pathway") { const g = q.get("goal"); if (g === "invest" || g === "finance") BS.goal = g; html = pathwayPage(); after = () => { wireBuilder(); wireCards(document.getElementById("app")); if (BS.generated) renderResults(true); if (location.hash.includes("#saved")) setTimeout(() => { const s = document.getElementById("saved"); if (s) s.scrollIntoView(); }, 50); }; }
  else if (parts[0] === "market") { html = marketPage(); after = wireMarket; }
  else if (parts[0] === "providers" && parts[1]) { html = providerPage(parts[1]); after = () => wireCards(document.getElementById("app")); key = "#/providers"; }
  else if (parts[0] === "providers") { html = providersPage(); }
  else if (parts[0] === "product") { html = productPage(parts[1]); key = "#/market"; }
  else if (parts[0] === "compare") { html = comparePage(q); after = wireCompare; }
  else if (parts[0] === "learn" && parts[1] === "uzbekistan") { html = textPage("uz", "l_uz", "l_uz_sub"); key = "#/learn"; }
  else if (parts[0] === "learn" && parts[1] === "legal-status") { html = textPage("legal", "l_legal", "l_legal_sub"); key = "#/learn"; }
  else if (parts[0] === "learn") { html = learnPage(parts[1]); after = wireLearn; }
  else if (parts[0] === "method") { html = methodPage(); }
  else if (parts[0] === "sources") { html = sourcesPage(); key = "#/method"; }
  else html = notFound();
  const el = document.getElementById("app"); el.innerHTML = html; setNav(key);
  if (after) after();
  startScene();
  if (!keep && !route.keepScroll) window.scrollTo(0, 0); route.keepScroll = false;
}

/* ================= BOOT ================= */
document.documentElement.dataset.theme = LS.get("sukoon-theme", "pearl");
shell();
window.addEventListener("hashchange", () => route());
route();

</script>
